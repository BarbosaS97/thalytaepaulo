<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compartilhe seus momentos — Thalyta &amp; Paulo</title>
  <!-- Página só para quem lê o QR Code: não deve aparecer em buscadores -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141b18">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/fotos.css">
</head>
<body>

  <main class="tela tela--fotos">
    <section class="cartao envio">
      <span class="rotulo">Casamento</span>
      <h1 class="script">Thalyta &amp; Paulo</h1>
      <div class="ornamento" aria-hidden="true"><span></span></div>
      <p class="envio__texto">Tirou uma foto ou gravou um vídeo da festa?<br>Compartilhe com os noivos para guardarem cada momento.</p>

      <label class="campo">
        <span>Seu nome (opcional)</span>
        <input id="campoNome" type="text" maxlength="80" autocomplete="name" placeholder="Para os noivos saberem de quem é">
      </label>

      <input id="campoArquivos" type="file" accept="image/*,video/*" multiple hidden>
      <button id="btnEscolher" class="botao botao--ouro" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>Escolher fotos e vídeos</span>
      </button>
      <p class="envio__dica">Até <span id="limiteMB">50</span> MB por arquivo. Pode escolher vários de uma vez.</p>

      <p id="erroEnvio" class="erro" role="alert" hidden></p>
    </section>

    <section id="areaFila" class="fila-area" hidden aria-live="polite">
      <p id="resumoFila" class="fila-resumo"></p>
      <ul id="fila" class="fila"></ul>
      <button id="btnMais" class="botao" type="button" hidden>Enviar mais</button>
    </section>

    <p class="rodape">Obrigado por fazer parte deste dia ♡</p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/fotos.js"></script>
</body>
</html>
